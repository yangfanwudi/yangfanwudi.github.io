      <script src="assets/config.js"></script>
  <script>
    // 按武将 id 分片加载，首屏不再下载全部 2,582 名武将
    (function () {
      const cache = {};
      const realFetch = window.fetch.bind(window);
      const shardOf = (id) => {
        let h = 0;
        for (const ch of id) h = (h + ch.charCodeAt(0)) % 26;
        return h;
      };
      window.fetch = async function (input, init) {
        const url = typeof input === "string" ? input : (input && input.url) || "";
        const m = url.match(/(?:^|\/)data\/heroes\/(.+)\.json$/);
        if (m) {
          const id = decodeURIComponent(m[1]);
          const shard = shardOf(id);
          if (!cache[shard]) {
            cache[shard] = realFetch(`data/hero-shards/${shard}.json`).then(r => r.json());
          }
          const map = await cache[shard];
          if (map && map[id]) {
            return new Response(JSON.stringify(map[id]), {
              status: 200,
              headers: { "Content-Type": "application/json" }
            });
          }
        }
        return realFetch(input, init);
      };
    })();
  </script>
    <script type="module" src="assets/app.js?v=1.8.4"></script>
  </body>
</html>
